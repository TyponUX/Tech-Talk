<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TECH Event – Weiterleitung</title>
    <meta http-equiv="refresh" content="2; url=https://github.com/PRODYNA-TECH/organization" />
    <style>
      :root {
        --bg: #0d1117;
        --panel: #111b22;
        --line: rgba(255,255,255,0.08);
        --text: #edfdf8;
        --muted: #a7b9c8;
        --accent: #00df75;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Inter, Arial, sans-serif;
        background: radial-gradient(circle at top left, rgba(0,223,117,0.12), transparent 22%), #0d1117;
        color: var(--text);
      }

      .box {
        width: min(90vw, 560px);
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 22px;
        padding: 32px 24px;
        text-align: center;
        box-shadow: 0 24px 50px rgba(0, 0, 0, 0.25);
      }

      .tag {
        display: inline-block;
        padding: 8px 12px;
        border-radius: 999px;
        background: rgba(0,223,117,0.12);
        border: 1px solid rgba(0,223,117,0.2);
        color: #9ff9c0;
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      h1 {
        font-size: clamp(2rem, 4vw, 2.8rem);
        margin: 18px 0 12px;
      }

      p {
        margin: 0;
        line-height: 1.6;
        color: var(--muted);
      }

      a {
        display: inline-block;
        margin-top: 22px;
        text-decoration: none;
        background: var(--accent);
        color: #07110d;
        font-weight: 800;
        padding: 12px 20px;
        border-radius: 12px;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="tag">TECH Event</div>
      <h1>Weiterleitung...</h1>
      <p>Du wirst gleich zur TECH-Organisation weitergeleitet.</p>
      <a href="https://github.com/PRODYNA-TECH/organization">Jetzt weiter</a>
    </div>
  </body>
</html>
